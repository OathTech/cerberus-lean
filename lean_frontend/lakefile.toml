srcDir = "test"
root = "Unit.FreshIntTest"
moreLinkArgs = ["native/fresh_int.o", "native/debug.o", "native/tags.o", "native/md5.o"]

# arc-7 S4: the term-emission instrument (parsed Core → Lean source terms;
# regenerates relsem/RelSem/T1Core.lean — see that file's header).
[[lean_exe]]
name = "emit-lean-core"
srcDir = "test"
root = "Unit.EmitLeanCoreMain"
moreLinkArgs = ["native/fresh_int.o", "native/debug.o", "native/tags.o", "native/md5.o"]

# arc-7 S4: T1 program-term drift gate + concrete differential on the
# assembled theorem object (RelSem/T1File.lean).
[[lean_exe]]
name = "emit-lean-core-test"
srcDir = "test"
root = "Unit.EmitLeanCoreTest"
moreLinkArgs = ["native/fresh_int.o", "native/debug.o", "native/tags.o", "native/md5.o"]

# arc-7 S5c (audit-1 F3): the T4EnvHyp first-in-process witness probe.
# Its OWN exe by design — the fresh-draw ORDERING is what it witnesses
# (never merge into another test). Run by scripts/test_verify.sh.
