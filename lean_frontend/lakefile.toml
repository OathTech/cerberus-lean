name = "CerberusLean"
# RelSem in defaultTargets since arc-7 S1: `lake build` elaborates
# relsem/RelSem/Audit.lean (the in-build axiom audit), so plain builds
# carry the gate (golean in-build audit property).
defaultTargets = ["CerberusLean", "RelSem", "cerberus-lean"]
moreLeanArgs = ["-DautoImplicit=false"]

# arc-7 S0 toolchain bump: batteries as a plain git require (the scoped
# Reservoir form needs network to resolve; the git URL is redirected to
# deps/mirrors/batteries.git by deps/gitconfig). Pinned at v4.32.0 =
# 023ce7d62a0531e22a5331e20b587817a80d49ff — the exact rev iris-lean's
# 4.32.2 build vendored (deps/iris-lean/Iris/lake-manifest.json), so the
# S4 iris-lean require will inherit a matching batteries.
[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.32.0"

# arc-7 S4: iris-lean, the Layer-3 program logic (ProgramLogic WP/adequacy,
# proof mode, GenHeap/GhostVar). Pinned to the exact rev the local build at
# deps/iris-lean is at (resolved offline via the deps/gitconfig redirect;
# mirror TODO recorded there for the next network window). The package
# lives in the repo's Iris/ subdir. Its own scoped requires (batteries,
# Qq @ v4.32.0) are shadowed by the direct git requires here so resolution
# never touches the Reservoir API (offline discipline; batteries rev above
# is already the iris-vendored one).
[[require]]
name = "iris"
git = "https://github.com/leanprover-community/iris-lean"
rev = "79dab154a64051384179c4d4e00511752cf2a168"
subDir = "Iris"

# Qq pinned at iris-lean's vendored rev (deps/iris-lean/Iris/lake-manifest.json);
# direct git require so the scoped form never needs the network (mirror:
# deps/mirrors/quote4.git).
[[require]]
name = "Qq"
git = "https://github.com/leanprover-community/quote4"
rev = "38d591e778f100aec9762bb582f9c7f55f50e9dc"

# LemLib is the Lem runtime library for Lean, from the septract/lem-lean fork.
# arc-8 close: pinned to the MERGED mdd/lean-backend head (arc-8 pin dance;
# DAEMON/DAEMON1/legacy failwith removed from LemLib in this lineage);
[[require]]
name = "LemLib"
git = "https://github.com/septract/lem-lean"
rev = "237867bbf1059dbb685156ce3db31910b3fcb449"
subDir = "lean-lib"

