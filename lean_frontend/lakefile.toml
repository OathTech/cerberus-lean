name = "CerberusLean"
defaultTargets = ["CerberusLean", "cerberus-lean"]
moreLeanArgs = ["-DautoImplicit=false"]

# LemLib is the Lem runtime library for Lean, from the septract/lem-lean fork.
[[require]]
name = "LemLib"
git = "https://github.com/septract/lem-lean"
rev = "mdd/lean-backend"
subDir = "lean-lib"

