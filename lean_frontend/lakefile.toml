# Relational semantics (arc 7, load-bearing since S1): Layer-2 skeleton
# over the generated opsem + the in-build axiom audit (RelSem/Audit.lean).
# A default target — `lake build` elaborates the audit.
[[lean_lib]]
name = "RelSem"
srcDir = "relsem"

[[lean_exe]]
name = "cerberus-lean"
root = "Main"
moreLinkArgs = ["native/fresh_int.o", "native/debug.o", "native/tags.o", "native/md5.o"]

# Test library: tests live under lean_frontend/test/ and import from
# the main CerberusLean lib. Each test exe has root "Unit.<Name>Test".
[[lean_lib]]
name = "CerberusLeanTest"
srcDir = "test"
globs = ["Unit.+"]

[[lean_exe]]
name = "core-parser-test"
srcDir = "test"
root = "Unit.CoreParserTest"
moreLinkArgs = ["native/fresh_int.o", "native/debug.o", "native/tags.o", "native/md5.o"]

[[lean_exe]]
name = "effects-proof-test"
srcDir = "test"
root = "Unit.EffectsProofTest"
moreLinkArgs = ["native/fresh_int.o", "native/debug.o", "native/tags.o", "native/md5.o"]

[[lean_exe]]
name = "totality-proof-test"
srcDir = "test"
root = "Unit.TotalityProofTest"
moreLinkArgs = ["native/fresh_int.o", "native/debug.o", "native/tags.o", "native/md5.o"]

[[lean_exe]]
