# Test library: tests live under lean_frontend/test/ and import from
# the main CerberusLean lib. Each test exe has root "Unit.<Name>Test".
[[lean_lib]]
name = "CerberusLeanTest"
srcDir = "test"
globs = ["Unit.+"]

[[lean_exe]]
name = "core-parser-test"
srcDir = "test"
root = "Unit.CoreParserTest"
moreLinkArgs = ["native/md5.o"]

[[lean_exe]]
name = "effects-proof-test"
srcDir = "test"
root = "Unit.EffectsProofTest"
moreLinkArgs = ["native/md5.o"]

[[lean_exe]]
name = "totality-proof-test"
srcDir = "test"
root = "Unit.TotalityProofTest"
moreLinkArgs = ["native/md5.o"]

[[lean_exe]]
name = "fresh-int-test"
srcDir = "test"
root = "Unit.FreshIntTest"
moreLinkArgs = ["native/md5.o"]

# arc-10 S3: pretty-printer mirrors vs recorded oracle outputs (OCaml
# string_of_float / %.*f transcript + Pp_core_ctype / pp_value shapes).
[[lean_exe]]
name = "pp-test"
srcDir = "test"
root = "Unit.PPTest"
moreLinkArgs = ["native/md5.o"]

# FUEL arc (2026-09-03): the consumer-shaped exemplar theorem over the
# shipped fuel-parametric pipeline (CerbND.drive_lemFuel), kernel-checked
# at compile time; main reports success. Design:
# docs/2026-09-02_fuel-arc-design.md §1.4/§6.
[[lean_exe]]
name = "fuel-exemplar-test"
srcDir = "test"
root = "Unit.FuelExemplar"
moreLinkArgs = ["native/md5.o"]

# FUEL arc C2 (2026-09-04): the (A)/(B)/(C) classifier of every fuel'd worker
# (test/Unit/FuelFormsTool.lean) — a RUNTIME instrument over the compiled
# environment (importModules), driven by scripts/check_fuel_forms.sh, which is
# the policy + plants (test_unit.sh runs it). Not a compile-time proof exe.
[[lean_exe]]
name = "fuel-forms-tool"
srcDir = "test"
root = "Unit.FuelFormsTool"
supportInterpreter = true

# C-TF1: kernel propagation contracts and concrete memory-arm witnesses.
[[lean_exe]]
name = "monadic-failstop-test"
srcDir = "test"
root = "Unit.MonadicFailstop"
moreLinkArgs = ["native/md5.o"]

# allocator soundness (upstream-tray draft 44, remedy 1 landed 2026-09-16): the
# four draft-44 states evaluated on the ACTUAL CerbMem.allocator — a RUNTIME
# witness (exit code); imports CerbMemAllocatorProofs so the GENERAL kernel
# theorem allocator_active_sound is compiled on every test_unit.sh run.
[[lean_exe]]
name = "allocator-soundness-test"
srcDir = "test"
root = "Unit.AllocatorSoundnessTest"
moreLinkArgs = ["native/md5.o"]


# semantics-audit repairs D1 (2026-09-11): CerbFloat.of_string bit-pattern pins
[[lean_exe]]
name = "float-literal-test"
srcDir = "test"
root = "Unit.FloatLiteralTest"

# semantics-audit repairs D3 (2026-09-11): Ctype_aux.are_compatible array-bound arm pins (finding 5)
[[lean_exe]]
name = "are-compatible-test"
srcDir = "test"
root = "Unit.AreCompatibleTest"

# parser-progress-measure D4.2 (2026-09-15): the many/many1 restatement's equivalence theorems
[[lean_exe]]
name = "many-restatement-test"
srcDir = "test"
root = "Unit.ManyRestatementTest"

# seam-hygiene H1 (2026-09-18): the hand-written seams' failure leaves are LemLib's opaque
# `failwithI` — `#guard_msgs` on the orchestrator's two FAILING `rfl` probes (a transparent
# leaf would make them succeed and the build RED), `failwithI` opaque in the environment,
# default arms still reduce; H2: `CerbGlobal.has_switch … = false` by rfl for the ported arms
[[lean_exe]]
name = "opaque-failure-test"
srcDir = "test"
root = "Unit.OpaqueFailureTest"
moreLinkArgs = ["native/md5.o"]

# program-data parameters E-A (2026-09-20): the enum's compatible type is program data — the
# design note §4 kernel pins (normalise/sizeof/alignof at a registered enum by rfl given the map,
# GCC's rule in lem, register_enum = true) + #guard_msgs that the retired registry names are gone
[[lean_exe]]
name = "enum-data-test"
srcDir = "test"
root = "Unit.EnumDataTest"

# D-S: explicit run digest, consumer acceptance equations and entry/fixture pins.
[[lean_exe]]
name = "run-digest-test"
srcDir = "test"
root = "Unit.RunDigestTest"
# match-pattern-arity (2026-09-20, cerberus-sl hidden-state note item 7): match_pattern
# and typecheck_pattern fail CLOSED on a tuple-arity mismatch — T1–T3 the consumer's
# acceptance facts by rfl (none on mismatch, select_case continues, bindings + order
# kept), T4 the negative control, T5 the typechecker's guard (runtime: partial def)
[[lean_exe]]
name = "match-pattern-arity-test"
srcDir = "test"
root = "Unit.MatchPatternArityTest"
moreLinkArgs = ["native/md5.o"]
