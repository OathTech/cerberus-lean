# relsem — arc-11 S4 (2026-08-22): THE PACKAGE REHEARSAL (charter S4,
# the [USER] two-part-design item). RelSem (Layer 2/3: kits, walker,
# Iris coupling, slate theorems, THE IN-BUILD AUDITS) as its OWN Lake
# package, requiring the semantics package by PATH. Rehearsal only —
# no repo split; sources stay where they were (this package's srcDir
# is this directory; the audit gates re-home with the lib).
#
# Dependency direction (measured constraint, S4 record): relsem
# REQUIRES CerberusLean (its modules import the generated opsem), so
# the root cannot require relsem back (Lake forbids cycles). The
# in-build-gate property therefore rides THIS package's plain
# `lake build` (RelSem is the default target; RelSem/Audit.lean +
# Kit/Audit elaborate on every build, fail-closed); the gate scripts
# drive both packages' builds.
#
# packagesDir points at the parent workspace's package store so the
# git dependencies (batteries/iris/Qq/LemLib) are SHARED — no
# re-clone, no re-build, offline-safe (deps/gitconfig redirects).

name = "relsem"
defaultTargets = ["RelSem"]
moreLeanArgs = ["-DautoImplicit=false"]
packagesDir = "../.lake/packages"

[[require]]
name = "CerberusLean"
path = ".."

# The RelSem library. REHEARSAL FINDING (S4 record): Lake resolves
# imports by root-module PREFIX, so a root module `RelSem` would
# claim the dep-provided exec-core modules (RelSem.Call/Machine/
# RunND/ExecModel/Cerberus, root package RelSemCore lib) too — the
# roots are therefore ENUMERATED leaf modules (component-wise prefix
# semantics keep them disjoint), with `RelSemAll` as the aggregator
# (the old RelSem.lean, renamed; imports of the exec core resolve to
# the path-required parent).
[[lean_lib]]
name = "RelSem"
roots = ["RelSemAll", "RelSem.Audit", "RelSem.ConstructLaws", "RelSem.DeriveState", "RelSem.LawRegistry", "RelSem.RoundEval", "RelSem.RoundEval.Core", "RelSem.RoundEval.Hyp", "RelSem.RoundEval.Mint", "RelSem.RoundEval.Arith", "RelSem.RoundEval.Classify", "RelSem.RoundEval.Lanes", "RelSem.RoundEval.Rounds", "RelSem.RoundEval.Assembly", "RelSem.WpGround", "RelSem.FuelHooks", "RelSem.T1Threaded", "RelSem.T2Threaded", "RelSem.T3Threaded", "RelSem.IrisAdequacy", "RelSem.IrisLang", "RelSem.IrisRules", "RelSem.IrisState", "RelSem.MemLocal", "RelSem.CerbHeapRA", "RelSem.CerbHeapWP", "RelSem.CerbHeapDemo", "RelSem.CerbHeapWalk", "RelSem.PerStep", "RelSem.PerStepIris", "RelSem.PerStepCall", "RelSem.PerStepSmoke", "RelSem.PerStepRunner", "RelSem.PerStepOwnP", "RelSem.PerStepTactics", "RelSem.PerStepTacSmoke", "RelSem.Kit.AppEq", "RelSem.Kit.Audit", "RelSem.Kit.Env", "RelSem.Kit.Eval", "RelSem.Kit.Loop", "RelSem.Kit.Map", "RelSem.Kit.Mem", "RelSem.Kit.Round", "RelSem.SlateCore", "RelSem.SlateFiles", "RelSem.SlateWP", "RelSem.T1", "RelSem.T1AppEq", "RelSem.T1Core", "RelSem.T1File", "RelSem.T2", "RelSem.T2AppEq", "RelSem.T3", "RelSem.T3AppEq", "RelSem.T4", "RelSem.T4AppEq", "RelSem.T4Defs", "RelSem.T4Threaded", "RelSem.T5Fixture", "RelSem.T5Walks", "RelSem.T5Inv", "RelSem.T6Probe", "RelSem.Segment", "RelSem.SegmentFaces", "RelSem.T7Walks", "RelSem.T7", "RelSem.T5Seam", "RelSem.T5Spine", "RelSem.T5", "RelSem.T5Iter", "RelSem.T5Prefix", "RelSem.Tactics.AppEqAttr", "RelSem.Tactics.AppWalk", "RelSem.Tactics.WalkTrace"]

